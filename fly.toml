# Fly.io config. First deploy: see docs/deploy.md.
app = 'clinic-api-andreyhuey'
primary_region = 'lhr'

[build]
  dockerfile = 'Dockerfile'

# Runs in a one-off machine before each release. If it fails, the old
# version keeps serving.
[deploy]
  release_command = 'node dist/release.js'

[env]
  NODE_ENV = 'production'
  PORT = '3001'
  SEED_DEMO = 'true'

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = '10s'
    interval = '15s'
    method = 'GET'
    path = '/health'
    timeout = '3s'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
