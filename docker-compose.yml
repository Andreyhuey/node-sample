# Full local stack: Postgres, a one-off migration job, and the API.
#   docker compose up --build        -> API on http://localhost:3001
#   docker compose up -d db          -> only Postgres, for `npm run dev`
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: clinic
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates clinic_test on first start, for `npm test`.
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      retries: 10

  migrate:
    build: .
    command: ['node', 'dist/db/migrate.js']
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/clinic
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    init: true
    ports:
      - '3001:3001'
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/clinic
      JWT_SECRET: ${JWT_SECRET:-local-docker-secret-change-me-0123456789}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
