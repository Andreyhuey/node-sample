deployment:
  tasks:
    - export DEPLOYPATH=/home/andreyhu/sample.andreyhuey.dev/repo
    - export NODEVENV=/home/andreyhu/nodevenv/sample.andreyhuey.dev/repo/22
    - . $NODEVENV/bin/activate
    - npm install
    - npm run build
    - /bin/mkdir -p $DEPLOYPATH/dist
    - /bin/cp -R dist/. $DEPLOYPATH/dist/
    - /bin/cp package.json $DEPLOYPATH/
    - /bin/mkdir -p $DEPLOYPATH/tmp
    - /bin/touch $DEPLOYPATH/tmp/restart.txt
